services:
  pacific-shore-bot:
    build: .
    container_name: pacific-shore-bot
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      STATE_FILE: /data/availability_state.json
    volumes:
      - pacific-shore-data:/data

volumes:
  pacific-shore-data:
